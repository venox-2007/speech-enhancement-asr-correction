[server]
fileWatcherType = "none"
folderWatchBlacklist = ["**/.venv/**", "**/site-packages/**", "**/.git/**"]
headless = true

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#38bdf8"
backgroundColor = "#0b0f19"
secondaryBackgroundColor = "#111827"
textColor = "#f1f5f9"
font = "sans serif"
